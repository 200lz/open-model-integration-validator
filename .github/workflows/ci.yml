name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      # actions/checkout v7.0.1
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify readiness audit history
        shell: bash
        run: |
          set -eu
          git cat-file -e 'ffa57d385ffe465b6418daaa8a2530ff8d76e5fa^{commit}'
          test "$(git rev-list --count ffa57d385ffe465b6418daaa8a2530ff8d76e5fa)" -eq 36
          for tag in v0.1.0 v0.2.0 v0.3.0 v0.4.0 v0.5.0 v0.6.0 v0.7.0 v0.8.0 v0.9.0 v0.10.0; do
            git cat-file -e "refs/tags/${tag}^{tag}"
          done
          test "$(git rev-parse refs/tags/v0.10.0)" = d26468e050f4f0aea11e1d1631c92e1e1fbb7bcc
          test "$(git rev-parse 'refs/tags/v0.10.0^{commit}')" = 09f8265d62f2ea1dfda7da2cd3eb4b3e89639222

      # actions/setup-python v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Dependency and CLI smoke checks
        run: |
          python -m pip check
          omiv --version
          omiv model-packs list

      - name: Public-release static audit
        run: |
          python tools/audit_public_release_readiness.py --json
          python tools/audit_github_publication_controls.py --json
          python tools/audit_r1f_publication_readiness.py --json

      - name: Lint and type-check
        run: |
          ruff check .
          mypy

      - name: Check formatting only for readiness Python changes
        run: |
          ruff format --check \
            .github/release-tools/verify_release.py \
            src/omiv/__init__.py \
            src/omiv/cli.py \
            tests/test_conversion_integration.py \
            tests/test_github_publication_controls.py \
            tests/test_public_release_readiness.py \
            tests/test_r1f_publication_readiness.py \
            tests/test_release_publication_recovery.py \
            tests/test_v0_10_0_release_preparation.py \
            tools/audit_github_publication_controls.py \
            tools/audit_public_release_readiness.py \
            tools/audit_r1f_publication_readiness.py

      - name: Compile Python sources
        run: python -m compileall -q src tests tools

      - name: Focused readiness tests
        run: |
          python -m pytest -q \
            tests/test_public_release_readiness.py \
            tests/test_conversion_integration.py \
            tests/test_github_publication_controls.py \
            tests/test_r1f_publication_readiness.py
          python -m pytest -q \
            tests/test_release_publication_recovery.py \
            tests/test_v0_10_0_release_preparation.py

      - name: Full offline test suite
        env:
          OMIV_RUN_CONVERSION_INTEGRATION: "0"
          OMIV_RUN_GGUF_INTEGRATION: "0"
          OMIV_RUN_HF_INTEGRATION: "0"
          OMIV_RUN_MAPPING_INTEGRATION: "0"
          OMIV_RUN_REMOTE_INTEGRATION: "0"
        run: python -m pytest
