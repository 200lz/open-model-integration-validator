[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-model-integration-validator"
version = "0.1.0"
description = "Evidence-driven checkpoint schema validation for open models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
omiv = "omiv.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/omiv"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
markers = [
  "integration: tests that require the local full checkpoint inventory",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
