[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-model-integration-validator"
version = "0.10.0"
description = "Evidence-driven checkpoint schema validation for open models"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Linzhang Chen" },
]
keywords = ["ai", "artifacts", "evidence", "provenance", "validation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=46.0.1,<51",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
gguf = [
  "gguf==0.19.0",
]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
omiv = "omiv.cli:app"

[project.urls]
Repository = "https://github.com/200lz/open-model-integration-validator"
Issues = "https://github.com/200lz/open-model-integration-validator/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/omiv"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tools/audit_public_release_readiness.py",
  "/docs",
  "/README.md",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/CONTRIBUTING.md",
  "/GOVERNANCE.md",
  "/LICENSE",
  "/NOTICE",
  "/SECURITY.md",
  "/SUPPORT.md",
  "/THIRD_PARTY_NOTICES.md",
  "/TRADEMARKS.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
markers = [
  "integration: tests that require the local full checkpoint inventory",
  "remote_integration: opt-in tests that access a pinned remote repository",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
